---
# Reusable vLLM health check tasks
# Import this file with: import_tasks: tasks/health-check-vllm.yml
#
# Required variables:
#   - vllm_server.host: vLLM server hostname
#   - vllm_server.port: vLLM server port
#
# Optional variables:
#   - health_check_retries: Number of retries (default: 30)
#   - health_check_delay: Delay between retries in seconds (default: 5)

- name: Check vLLM /health endpoint
  ansible.builtin.uri:
    url: "http://{{ vllm_server.host }}:{{ vllm_server.port }}/health"
    method: GET
    status_code: 200
  register: health_check
  retries: "{{ health_check_retries | default(30) }}"
  delay: "{{ health_check_delay | default(5) }}"
  until: health_check.status == 200

- name: Get vLLM version
  ansible.builtin.uri:
    url: "http://{{ vllm_server.host }}:{{ vllm_server.port }}/version"
    method: GET
    return_content: true
  register: vllm_version_response
  failed_when: vllm_version_response.status not in [200, 404]

- name: Parse vLLM version
  ansible.builtin.set_fact:
    vllm_version: "{{ vllm_version_response.json.version | default('unknown') }}"
  when: vllm_version_response.status == 200

- name: Display vLLM health status
  ansible.builtin.debug:
    msg:
      - "vLLM Server Health Check: PASSED"
      - "Server: http://{{ vllm_server.host }}:{{ vllm_server.port }}"
      - "Version: {{ vllm_version | default('unknown') }}"
